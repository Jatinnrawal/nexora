services:

  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora_user
      POSTGRES_PASSWORD: nexora_pass

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora_user -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - nexora-network


  minio:
    image: quay.io/minio/minio
    container_name: nexora-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: nexoraadmin
      MINIO_ROOT_PASSWORD: nexora-storage-2026

    volumes:
      - minio_data:/data

    ports:
      - "9000:9000"
      - "9001:9001"

    networks:
      - nexora-network


  backend:
    build:
      context: ./backend

    container_name: nexora-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://nexora_user:nexora_pass@postgres:5432/nexora
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: nexoraadmin
      MINIO_SECRET_KEY: nexora-storage-2026
      MINIO_BUCKET: nexora-files
      MINIO_SECURE: "false"

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

    ports:
      - "8000:8000"

    networks:
      - nexora-network


  frontend:
    build:
      context: .

    container_name: nexora-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:80"

    networks:
      - nexora-network


  prometheus:
    image: prom/prometheus:latest
    container_name: nexora-prometheus
    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    networks:
      - nexora-network


  grafana:
    image: grafana/grafana:latest
    container_name: nexora-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    networks:
      - nexora-network      
        

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: nexora-cadvisor
    restart: unless-stopped

    ports:
      - "8081:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    networks:
      - nexora-network



volumes:
  postgres_data:
  minio_data:


networks:
  nexora-network:
    driver: bridge
